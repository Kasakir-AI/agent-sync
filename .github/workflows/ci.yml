name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check agent_sync tests
      - run: python -m pytest -q
      - name: the installed package serves the review page
        run: |
          python -m venv /tmp/installed && /tmp/installed/bin/pip install -q .
          cd /tmp && HOME=$(mktemp -d) /tmp/installed/bin/python -c "
          import subprocess, sys, urllib.request
          p = subprocess.Popen(['/tmp/installed/bin/agent-sync', 'review', '--no-open'], stdout=subprocess.PIPE, text=True)
          url = p.stdout.readline().strip()
          page = urllib.request.urlopen(url).read().decode()
          p.terminate()
          sys.exit(0 if 'id=\"scan\"' in page else 'the page is missing from the installed package')"
  tests-pass:
    # The one check main's ruleset requires. It passes only when every test job above passed,
    # so the matrix can change without touching the ruleset.
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
