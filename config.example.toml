# Every key in ~/.config/agent-sync/config.toml is optional. These are the defaults.
# `agent-sync config` changes these settings by asking questions, and keeps your comments.
# Put top-level settings before the first table. Unknown keys in tables with fixed keys are errors.

# Agents to keep in step. Add "gemini" or "antigravity", or run `agent-sync agents`.
agents = ["claude", "codex", "cursor"]

# The enabled agent whose setup the others mirror.
source = "claude"

# Skill packages (GitHub owner/repo) installed for the enabled agents with the `skills` CLI.
# A package with an agents/ folder also gets its agents mirrored.
skill_packages = ["backnotprop/pstack"]

# The skills CLI to run with npx. "skills@latest" always uses the newest release; pin a version to hold it.
skills_cli = "skills@latest"
remove_dropped_skills = true   # uninstall skills a package no longer ships

mirror_roles = true     # copy pstack's per-role model lines from the source tool's pstack-models file
mirror_mcp = true       # add the source tool's user-level MCP servers to the other tools, update pinned
                        # packages, and offer to remove settings copies of servers a plugin already brings
update_clis = true      # update all enabled CLIs, or choose a subset such as ["claude", "codex"]
mirror_skills = true    # copy your own skills (not from a package) from the source tool to the others
skip_skills = []        # your own skills that stay in the source tool, e.g. ["only-for-claude"]
allow_duplicate_skills = []  # skill names a tool may load from two places without a warning, e.g. ["pdf"]
mirror_instructions = false  # share global instructions across the enabled agents
# If you leave this unset, upkeep asks once when Claude Code has notes and another agent is enabled.
# mirror_memory = true  # share eligible memory notes. Set false to keep sharing off.
private_memory = []     # memory notes that stay in Claude Code, e.g. ["my-accounts"]
share_memory = []       # notes flagged as sensitive that may be shared anyway
status_line = true      # one status line in Claude Code, Cursor CLI and Antigravity; Codex's built-in items
update_plugins = true   # update plugins and extensions for the enabled agents
update_mcp_programs = true   # upgrade the programs MCP servers run (Homebrew, npm, pipx, uv)
update_global_tools = false  # also update global npm, pipx and uv tools (true), or a list that may add "homebrew"
keep_mcp_versions = []  # MCP servers whose pinned package version stays, e.g. ["rea"]
mcp_major_updates = false    # let a pinned MCP package move to a new major version
keep_installed = []     # items upkeep never removes or replaces, by key or name (see `agent-sync pending`)
notify = true           # ask for approvals and show warnings in a macOS window and the Plannotator Inbox
warn_models = []        # warn when a model name containing one of these shows up, e.g. ["preview-"]
update_self = true      # update agent-sync itself (Homebrew, pipx, or a pip install from GitHub)
launcher = false        # keep "Agent Upkeep" on the Desktop and up to date (macOS); agent-sync launcher sets it
log_days = 7            # keep this many days of log lines
backup_days = 30        # keep backups of changed files for this many days
backup_max_mb = 500     # cap backups at this many MiB. Upkeep protects the current run.

# The model each tool's copy of a mirrored agent runs on.
[agent_models]
claude = "opus"
cursor = "claude-opus-5-5-high-fast"
codex = "gpt-6.2-sol"
codex_effort = "high"
gemini = ""             # inherit the Gemini CLI model

# Your own text added to the end of an agent's prompt, in every tool's copy of it.
# [agent_notes]
# poteto-agent = "On this machine pstack lives in ~/.agents/skills."

# Your own update command for a CLI, replacing the built-in one (Homebrew or the tool's own updater).
# [cli_commands]
# codex = ["npm", "install", "-g", "@openai/codex@latest"]
# claude = ["claude", "update"]

# Your own install command for `agent-sync setup`, replacing Homebrew / the official installer.
# Use an agent ID, or homebrew, git, or node.
# [install_commands]
# codex = ["npm", "install", "-g", "@openai/codex"]

# A program an MCP server runs that updates itself with its own command. Listed programs only.
# [program_updates]
# plannotator = ["plannotator", "update"]

# Extra commands run at the end of every upkeep, in order. A dry run only prints them.
# Each entry accepts name, command, and timeout.
# [[extra_steps]]
# name = "refresh my dotfiles"
# command = ["git", "-C", "/path/to/dotfiles", "pull", "--ff-only"]
# timeout = 300
